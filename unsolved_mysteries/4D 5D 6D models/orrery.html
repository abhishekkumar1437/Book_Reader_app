<title>Live Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;800&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: space fills the screen; the date and clock sit top-left like a mission clock, the time machine runs along the bottom, the body card sits right */
:root{
  --bg:#03040a;
  --glass:rgba(8,10,20,.72);
  --line:rgba(160,180,255,.16);
  --ink:#eef1fa;
  --muted:#8f97b3;
  --sun:#ffc35a;
  --orbit:#6f8bff;
  --display:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --mono:'Martian Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:14px;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
button,select,input{font-family:var(--display);color:var(--ink)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#clock{position:fixed;left:20px;top:16px;display:grid;gap:2px;pointer-events:none}
#clock .k{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#date{font:800 clamp(26px,4vw,40px)/1 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#time{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#labels button{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:2px 6px;font:500 11.5px var(--display);color:rgba(238,241,250,.82);white-space:nowrap;text-shadow:0 1px 3px #000;will-change:transform}
#labels button:hover,#labels button.sel{color:var(--sun)}
#labels button.moon{font-size:10.5px;color:rgba(238,241,250,.6)}
#card{position:fixed;right:16px;top:16px;width:300px;max-height:calc(100% - 130px);overflow:auto;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);padding:16px;display:grid;gap:10px}
#card h2{margin:0;font:800 26px/1 var(--display)}
#card .k{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#card p{margin:0;font-size:13.5px;line-height:1.5;color:#c9cfe2}
#facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
#facts div{background:rgba(8,10,20,.9);padding:7px 9px}
#facts small{display:block;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#facts b{font:600 14px var(--display);font-variant-numeric:tabular-nums}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(980px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grp .k{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{background:transparent;border:1px solid var(--line);padding:5px 9px;font-size:12.5px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--sun);color:var(--sun)}
#dateIn,#scale,#planetSel{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:5px 7px;font-size:12.5px;color-scheme:dark}
#rate{font:500 11px var(--mono);color:var(--muted);margin-left:auto}
#note{position:fixed;left:20px;top:92px;max-width:300px;font-size:12px;color:var(--muted);line-height:1.5;pointer-events:none}
@media (max-width:820px){
  #card{left:16px;right:16px;width:auto;top:auto;bottom:150px;max-height:32%;padding:12px}
  #card h2{font-size:20px}
  #note{display:none}
  #rate{margin-left:0}
}
</style>

<canvas id="gl" aria-label="3D solar system"></canvas>
<div id="labels"></div>
<div id="clock"><span class="k">Simulated date · UTC</span><div id="date"></div><div id="time"></div></div>
<p id="note">Planet positions come from NASA JPL orbital elements and Kepler's equation. Drag to orbit, scroll to zoom, click a planet to follow it.</p>

<aside id="card" aria-live="polite">
  <span class="k" id="cKind"></span>
  <h2 id="cName"></h2>
  <p id="cDesc"></p>
  <div id="facts"></div>
</aside>

<div id="bar">
  <div class="grp"><span class="k">Time</span>
    <button class="chip" id="rev" aria-pressed="false" title="Run time backwards">◀ Reverse</button>
    <button class="chip" id="pause" aria-pressed="false">Pause</button>
    <span id="speeds" class="grp"></span>
  </div>
  <div class="grp"><span class="k">Jump</span>
    <button class="chip" id="now">Today</button>
    <input type="date" id="dateIn" aria-label="Jump to date" min="1800-01-01" max="2200-12-31">
  </div>
  <div class="grp"><span class="k">View</span>
    <select id="scale" aria-label="Scale">
      <option value="readable">Readable scale</option>
      <option value="dist">True distances</option>
      <option value="true">True sizes and distances</option>
    </select>
    <select id="planetSel" aria-label="Follow"></select>
    <button class="chip" id="orbitsBtn" aria-pressed="true">Orbits</button>
  </div>
  <span id="rate"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const DEG=Math.PI/180,AU_KM=149597870.7,GM_SUN=1.32712440018e20,GM_EARTH=3.986004418e14;

/* ---------- JPL approximate Keplerian elements (Standish), J2000 ecliptic, rates per Julian century ---------- */
/* a(au), e, I(deg), L(deg), long. perihelion(deg), long. ascending node(deg), then the six rates */
const EL={
  mercury:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593, 0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081],
  venus:  [0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255, 0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418],
  earth:  [1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0, 0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0],
  mars:   [1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891, 0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343],
  jupiter:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909, -0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106],
  saturn: [9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448, -0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794],
  uranus: [19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503, -0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589],
  neptune:[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574, 0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664],
  pluto:  [39.48211675,0.24882730,17.14001206,238.92903833,224.06891629,110.30393684, -0.00031596,0.00005170,0.00004818,145.20780515,-0.04062942,-0.01183482],
};
function elements(key,T){const p=EL[key];return{a:p[0]+p[6]*T,e:p[1]+p[7]*T,I:(p[2]+p[8]*T)*DEG,L:p[3]+p[9]*T,wb:p[4]+p[10]*T,O:p[5]+p[11]*T}}
function solveE(M,e){let E=M+e*Math.sin(M);for(let k=0;k<12;k++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-12)break}return E}
function orbitPoint(el,E){
  const w=(el.wb-el.O)*DEG,O=el.O*DEG,xp=el.a*(Math.cos(E)-el.e),yp=el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(el.I),sI=Math.sin(el.I);
  return[(cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,(cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,(sw*sI)*xp+(cw*sI)*yp];
}
function helio(key,T){const el=elements(key,T);let M=((el.L-el.wb)%360+540)%360-180;const E=solveE(M*DEG,el.e);const p=orbitPoint(el,E);p.el=el;return p}
/* Moon: mean elements after Schlyter, geocentric ecliptic, in Earth radii */
function moonGeo(jd){
  const d=jd-2451543.5,N=(125.1228-0.0529538083*d)*DEG,i=5.1454*DEG,w=(318.0634+0.1643573223*d)*DEG,a=60.2666,e=0.0549,M=((115.3654+13.0649929509*d)%360)*DEG;
  const E=solveE(M,e),xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
  return[r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i)),r*(Math.sin(N)*Math.cos(v+w)+Math.cos(N)*Math.sin(v+w)*Math.cos(i)),r*Math.sin(v+w)*Math.sin(i)];
}

/* ---------- body data ---------- */
const BODIES=[
  {key:'sun',name:'Sun',kind:'Star',rKm:695700,size:3.2,rotH:609.12,tilt:7.25,desc:'A middle-aged yellow dwarf holding 99.86% of the solar system\'s mass. Everything else on screen orbits it.'},
  {key:'mercury',name:'Mercury',kind:'Planet',rKm:2439.7,size:.38,rotH:1407.6,tilt:.03,desc:'The fastest planet, with the most stretched orbit of the eight. Watch it speed up near the Sun and slow down far away.'},
  {key:'venus',name:'Venus',kind:'Planet',rKm:6051.8,size:.62,rotH:-5832.5,tilt:177.4,desc:'Spins backwards, and so slowly that its day is longer than its year.'},
  {key:'earth',name:'Earth',kind:'Planet',rKm:6371,size:.64,rotH:23.9345,tilt:23.44,desc:'Its 23.4° tilt stays pointed the same way in space all year. That is what makes the seasons.'},
  {key:'mars',name:'Mars',kind:'Planet',rKm:3389.5,size:.46,rotH:24.6229,tilt:25.19,desc:'Its day is only 37 minutes longer than Earth\'s. When Earth overtakes it, Mars appears to move backwards in our sky.'},
  {key:'jupiter',name:'Jupiter',kind:'Planet',rKm:69911,size:1.9,rotH:9.925,tilt:3.13,desc:'More than twice the mass of all the other planets combined, and the fastest spinner. Its day lasts under 10 hours.'},
  {key:'saturn',name:'Saturn',kind:'Planet',rKm:58232,size:1.6,rotH:10.656,tilt:26.73,desc:'Its rings are over 270,000 km wide but mostly under 100 m thick. Because of its tilt, they slowly turn edge-on to us and back over 29 years.'},
  {key:'uranus',name:'Uranus',kind:'Planet',rKm:25362,size:1.05,rotH:-17.24,tilt:97.77,desc:'Knocked on its side. Each pole gets about 42 years of daylight followed by 42 years of night.'},
  {key:'neptune',name:'Neptune',kind:'Planet',rKm:24622,size:1.02,rotH:16.11,tilt:28.32,desc:'Has completed only one orbit since it was discovered in 1846. It finished that first lap in 2011.'},
  {key:'pluto',name:'Pluto',kind:'Dwarf planet',rKm:1188.3,size:.3,rotH:-153.29,tilt:122.5,desc:'Its tilted, stretched orbit brings it closer to the Sun than Neptune for 20 years of its 248-year orbit. It last did so from 1979 to 1999.'},
  {key:'moon',name:'Moon',kind:'Earth\'s moon',rKm:1737.4,size:.18,rotH:655.72,tilt:6.68,desc:'Always shows Earth the same face, because its spin matches its orbit. It drifts away about 3.8 cm each year.'},
];
const byKey=Object.fromEntries(BODIES.map(b=>[b.key,b]));

/* ---------- three setup ---------- */
const cv=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,logarithmicDepthBuffer:true});
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03040a);
const camera=new THREE.PerspectiveCamera(45,1,1e-5,20000);
scene.add(new THREE.AmbientLight(0x404660,.25));
const sunLight=new THREE.PointLight(0xfff2dd,2.1,0,0);scene.add(sunLight);
function resize(){renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ---------- procedural textures ---------- */
function hash(x,y,z,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1440662683)+Math.imul(s,1013904223)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967295}
function vnoise(x,y,z,s){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),fx=x-X,fy=y-Y,fz=z-Z,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz);
  const L=(a,b,t)=>a+(b-a)*t,c=(i,j,k)=>hash(X+i,Y+j,Z+k,s);
  return L(L(L(c(0,0,0),c(1,0,0),u),L(c(0,1,0),c(1,1,0),u),v),L(L(c(0,0,1),c(1,0,1),u),L(c(0,1,1),c(1,1,1),u),v),w)}
function fbm(x,y,z,s,o){let a=.5,f=1,t=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,z*f,s+i);a*=.5;f*=2.02}return t}
const mix=(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t),hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function sphereTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
  for(let y=0;y<h;y++){const lat=(.5-y/h)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);for(let x=0;x<w;x++){const lon=x/w*Math.PI*2,px=cl*Math.cos(lon),py=sl,pz=cl*Math.sin(lon);
    const col=fn(px,py,pz,lat,lon),o=(y*w+x)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=col[3]==null?255:col[3]}}
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
const bands=(cols,turb,freq,s)=>(x,y,z,lat)=>{const t=lat*freq+(fbm(x*3,y*6,z*3,s,4)-.5)*turb;const f=((t/Math.PI*cols.length*.5)%cols.length+cols.length)%cols.length,i=Math.floor(f),k=f-i;return mix(hex(cols[i]),hex(cols[(i+1)%cols.length]),k*k*(3-2*k))};
const TEX={
  sun:()=>sphereTex(512,256,(x,y,z)=>{const n=fbm(x*8,y*8,z*8,7,4);return mix(hex('#ff7a12'),hex('#fff0a8'),Math.min(1,Math.max(0,n*1.6-.3)))}),
  mercury:()=>sphereTex(512,256,(x,y,z)=>{const n=fbm(x*4,y*4,z*4,11,5),c=vnoise(x*14,y*14,z*14,3);return mix(hex('#5f5a55'),hex('#b5aea6'),n*.9+(c>.82?-.25:0))}),
  venus:()=>sphereTex(512,256,(x,y,z,lat)=>{const n=fbm(x*2,y*7,z*2,21,5);return mix(hex('#b98a4a'),hex('#f2dcae'),n)}),
  earth:()=>sphereTex(1024,512,(x,y,z,lat)=>{
    const n=fbm(x*1.8+3,y*1.8,z*1.8,31,6),dry=fbm(x*4,y*4,z*4,41,3),al=Math.abs(lat);
    if(al>1.25)return hex('#f4f7fb');
    if(n<.52){const t=Math.max(0,Math.min(1,(n-.38)/.14));return mix(hex('#061a46'),hex('#1d5fa5'),t*t)}
    const e=(n-.52)/.3;let c=mix(hex('#3d7a35'),hex('#b39b62'),Math.max(0,Math.min(1,(dry-.4)*2.2+(al<.45?.25:0))));c=mix(c,hex('#7b6c5a'),Math.min(1,e*1.4));if(e>.75||al>1.1)c=mix(c,hex('#f4f7fb'),.8);return c}),
  clouds:()=>sphereTex(1024,512,(x,y,z)=>{const n=fbm(x*3+9,y*5,z*3,51,5);const a=Math.max(0,Math.min(1,(n-.5)*4));return[255,255,255,Math.round(a*215)]}),
  moon:()=>sphereTex(512,256,(x,y,z)=>{const n=fbm(x*3,y*3,z*3,61,5),m=fbm(x*1.2,y*1.2,z*1.2,62,3);return mix(m>.56?hex('#5e5d5b'):hex('#8d8b88'),hex('#c9c6c1'),n*.7)}),
  mars:()=>sphereTex(512,256,(x,y,z,lat)=>{if(Math.abs(lat)>1.3)return hex('#f1ece4');const n=fbm(x*3,y*3,z*3,71,5),m=fbm(x*1.5,y*1.5,z*1.5,72,3);let c=mix(hex('#8c3a1f'),hex('#d4774a'),n);if(m>.58)c=mix(c,hex('#4a2216'),.55);return c}),
  jupiter:()=>{const f=bands(['#efe5d3','#c9a274','#a5643f','#e8d9bb','#b78a5e','#f3ebdc'],1.3,7,81);return sphereTex(1024,512,(x,y,z,lat,lon)=>{const dl=lat+.39,dn=((lon-4.1+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;if((dl*dl)/.0036+(dn*dn)/.03<1)return hex('#c4553a');return f(x,y,z,lat)})},
  saturn:()=>sphereTex(512,256,bands(['#efe2bd','#d7bf8c','#c4a56d','#f1e6c8','#dcc596'],.6,6,91)),
  uranus:()=>sphereTex(512,256,bands(['#a7e1e4','#b8eaec','#9fd6dc'],.3,4,101)),
  neptune:()=>sphereTex(512,256,(x,y,z,lat,lon)=>{const b=bands(['#3c62d4','#2f4fb8','#5079e0','#3456c4'],.7,5,111)(x,y,z,lat);const dl=lat+.35,dn=((lon-2+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return(dl*dl)/.01+(dn*dn)/.04<1?mix(b,hex('#1a2a70'),.7):b}),
  pluto:()=>sphereTex(512,256,(x,y,z,lat,lon)=>{const n=fbm(x*3,y*3,z*3,121,4);let c=mix(hex('#8a6a50'),hex('#d8c3a4'),n);const dl=lat-.1,dn=((lon-1+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;if((dl*dl)/.2+(dn*dn)/.3<1)c=mix(c,hex('#f2e9da'),.7);return c}),
};
function ringTex(){const c=document.createElement('canvas');c.width=512;c.height=4;const g=c.getContext('2d');
  // radius in Saturn radii from 1.24 (inner C ring) to 2.27 (outer A ring)
  for(let i=0;i<512;i++){const r=1.24+i/511*1.03;let a=0,col='216,196,160';
    if(r<1.53){a=.18+.05*Math.sin(r*90)}else if(r<1.95){a=.75+.15*Math.sin(r*140)}else if(r<2.03){a=.05}else if(r<2.27){a=.5+.1*Math.sin(r*120)}if(r>2.205&&r<2.215)a=.05;
    g.fillStyle=`rgba(${col},${Math.max(0,a)})`;g.fillRect(i,0,1,4)}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}

/* ---------- build bodies ---------- */
const objs={};
BODIES.forEach(b=>{
  const holder=new THREE.Group(),tiltG=new THREE.Group(),spin=new THREE.Group();holder.add(tiltG);tiltG.add(spin);tiltG.rotation.x=-b.tilt*DEG;
  const geo=new THREE.SphereGeometry(1,64,32);
  const mat=b.key==='sun'?new THREE.MeshBasicMaterial({map:TEX.sun()}):new THREE.MeshStandardMaterial({map:TEX[b.key](),roughness:.95,metalness:0});
  const mesh=new THREE.Mesh(geo,mat);mesh.userData.key=b.key;spin.add(mesh);
  if(b.key==='earth'){const cl=new THREE.Mesh(new THREE.SphereGeometry(1.012,64,32),new THREE.MeshStandardMaterial({map:TEX.clouds(),transparent:true,depthWrite:false,roughness:1}));spin.add(cl);b.clouds=cl;
    const atm=new THREE.Mesh(new THREE.SphereGeometry(1.06,48,24),new THREE.MeshBasicMaterial({color:0x5aa0ff,transparent:true,opacity:.12,side:THREE.BackSide,blending:THREE.AdditiveBlending}));tiltG.add(atm)}
  if(b.key==='saturn'){const rg=new THREE.RingGeometry(1.24,2.27,160,1),pos=rg.attributes.position,uv=rg.attributes.uv;for(let i=0;i<pos.count;i++){const r=Math.hypot(pos.getX(i),pos.getY(i));uv.setXY(i,(r-1.24)/1.03,.5)}
    const ring=new THREE.Mesh(rg,new THREE.MeshStandardMaterial({map:ringTex(),transparent:true,side:THREE.DoubleSide,depthWrite:false,roughness:1}));ring.rotation.x=-Math.PI/2;tiltG.add(ring)}
  if(b.key==='sun'){const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0xffb347,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));glow.scale.set(5,5,1);holder.add(glow);b.glow=glow}
  scene.add(holder);objs[b.key]={b,holder,tilt:tiltG,spin,mesh};
});
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.2,'rgba(255,220,150,.6)');gr.addColorStop(1,'rgba(255,160,60,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}

/* stars */
(()=>{const n=5000,pos=new Float32Array(n*3),col=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*2-1,t=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u);
  let x=r*Math.cos(t),y=u,z=r*Math.sin(t);if(i<1800){const band=(Math.random()-.5)*.25;const a=Math.random()*Math.PI*2;x=Math.cos(a);z=Math.sin(a);y=band;const L=Math.hypot(x,y,z);x/=L;y/=L;z/=L;const tilt=1.05;const yy=y*Math.cos(tilt)-z*Math.sin(tilt),zz=y*Math.sin(tilt)+z*Math.cos(tilt);y=yy;z=zz}
  pos.set([x*9000,y*9000,z*9000],i*3);const w=.5+Math.random()*.5,tint=Math.random();col.set([w*(tint>.8?1:.85),w*.9,w*(tint<.2?1:.95)],i*3)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.85,depthWrite:false})))})();

/* asteroid belt: circular-ish Kepler orbits with real periods */
const AST=2200,astPos=new Float32Array(AST*3),astData=[];
for(let i=0;i<AST;i++){const a=2.1+Math.pow(Math.random(),.8)*1.2;astData.push({a,inc:(Math.random()-.5)*.25,node:Math.random()*Math.PI*2,M0:Math.random()*Math.PI*2,n:2*Math.PI/(365.25*Math.pow(a,1.5))})}
const astGeo=new THREE.BufferGeometry();astGeo.setAttribute('position',new THREE.BufferAttribute(astPos,3));
const astPts=new THREE.Points(astGeo,new THREE.PointsMaterial({color:0x9a8e7a,size:1.4,sizeAttenuation:false,transparent:true,opacity:.6,depthWrite:false}));astPts.frustumCulled=false;scene.add(astPts);

/* orbit lines */
const ORB=['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'],orbitLines={};
ORB.forEach(k=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(361*3),3));const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:k==='pluto'?0x8a7f9a:0x6f8bff,transparent:true,opacity:.32}));l.frustumCulled=false;scene.add(l);orbitLines[k]=l});

/* ---------- scale modes ---------- */
const MODES={
  readable:{d:r=>14*Math.sqrt(r),size:b=>b.size,moon:2.6,sunSize:3.2},
  dist:{d:r=>14*r,size:b=>b.size,moon:2.6,sunSize:3.2},
  true:{d:r=>14*r,size:b=>b.rKm/AU_KM*14,moon:null,sunSize:null},
};
let mode='readable';
const toScene=(p,m)=>{const r=Math.hypot(p[0],p[1],p[2])||1e-12,s=MODES[m].d(r)/r;return new THREE.Vector3(p[0]*s,p[2]*s,-p[1]*s)};

/* ---------- time ---------- */
const nowJD=()=>Date.now()/86400000+2440587.5;
let jd=nowJD(),rateDays=1,dir=1,paused=false;
const SPEEDS=[['Real time',1/86400],['1 hour/s',1/24],['1 day/s',1],['1 week/s',7],['1 month/s',30.44],['1 year/s',365.25]];
const sp=$('#speeds');SPEEDS.forEach(([n,v],i)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.setAttribute('aria-pressed',v===1);b.onclick=()=>{rateDays=v;[...sp.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};sp.appendChild(b)});
$('#rev').onclick=e=>{dir=-dir;e.currentTarget.setAttribute('aria-pressed',dir<0)};
$('#pause').onclick=e=>{paused=!paused;e.currentTarget.setAttribute('aria-pressed',paused);e.currentTarget.textContent=paused?'Play':'Pause'};
$('#now').onclick=()=>{jd=nowJD()};
$('#dateIn').onchange=e=>{const d=new Date(e.target.value+'T12:00:00Z');if(!isNaN(d))jd=d.getTime()/86400000+2440587.5};
$('#scale').onchange=e=>{mode=e.target.value;view.want=defaultDist(sel);orbitDirty=true};
$('#orbitsBtn').onclick=e=>{const v=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',v);ORB.forEach(k=>orbitLines[k].visible=v)};

/* ---------- camera & selection ---------- */
let sel='sun';
const view={yaw:.9,pitch:.55,dist:110,want:110,target:new THREE.Vector3()};
const ps=$('#planetSel');[['overview','Whole system'],...BODIES.map(b=>[b.key,'Follow '+b.name])].forEach(([k,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;ps.appendChild(o)});
ps.onchange=e=>select(e.target.value==='overview'?'sun':e.target.value,e.target.value==='overview');
function bodyRadius(k){const m=MODES[mode],b=byKey[k];if(k==='sun')return m.sunSize||b.rKm/AU_KM*14;return m.size(b)}
function defaultDist(k){if(k==='sun')return mode==='readable'?110:mode==='dist'?520:520;return Math.max(bodyRadius(k)*7,mode==='true'?bodyRadius(k)*7:2)}
function select(k,overview){sel=k;view.locked=false;view.want=overview?defaultDist('sun'):defaultDist(k);document.querySelectorAll('#labels button').forEach(x=>x.classList.toggle('sel',x.dataset.k===k));ps.value=overview?'overview':k;updCard(true)}
let drag=null,pinch=null,moved=false;const pts=new Map();
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);moved=false;if(pts.size===1)drag={x:e.clientX,y:e.clientY};else{drag=null;const[a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);view.want=Math.max(1e-4,Math.min(4000,view.want*pinch/d));pinch=d;return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;view.yaw-=dx*.005;view.pitch=Math.max(-1.5,Math.min(1.5,view.pitch+dy*.005));drag={x:e.clientX,y:e.clientY}}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){if(!moved&&drag)pick(e);drag=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();view.want=Math.max(1e-4,Math.min(4000,view.want*Math.exp(e.deltaY*.0012)))},{passive:false});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,camera);const hits=ray.intersectObjects(Object.values(objs).map(o=>o.mesh));if(hits.length)select(hits[0].object.userData.key)}

/* labels */
const lbl=$('#labels');
BODIES.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.name;btn.dataset.k=b.key;if(b.key==='moon')btn.className='moon';btn.onclick=()=>select(b.key);lbl.appendChild(btn);objs[b.key].label=btn});

/* ---------- info card ---------- */
const fmtKm=km=>km>=1e6?(km/1e6).toFixed(km>=1e8?0:1)+' million km':Math.round(km).toLocaleString('en-US')+' km';
let lastCard=0;
function updCard(force){
  const t=performance.now();if(!force&&t-lastCard<250)return;lastCard=t;
  const b=byKey[sel],st=state;$('#cKind').textContent=b.kind;$('#cName').textContent=b.name;$('#cDesc').textContent=b.desc;
  const F=[];
  if(sel==='sun'){F.push(['Radius','695,700 km'],['Spin (equator)','25.4 days'],['Light to Earth',(st.helio.earth.r*499.005/60).toFixed(1)+' min'],['Planets shown','8 + Pluto'])}
  else if(sel==='moon'){const r=st.moonKm;F.push(['From Earth',fmtKm(r)],['Light delay',(r/299792.458).toFixed(2)+' s'],['Orbital speed',Math.sqrt(GM_EARTH*(2/(r*1000)-1/384400e3)/1e6).toFixed(2)+' km/s'],['Month','27.3 days'])}
  else{const h=st.helio[sel],a=h.el.a,r=h.r,v=Math.sqrt(GM_SUN*(2/(r*AU_KM*1000)-1/(a*AU_KM*1000)))/1000;
    const e=st.helio.earth,dE=Math.hypot(h[0]-e[0],h[1]-e[1],h[2]-e[2]);
    F.push(['From Sun',r.toFixed(3)+' au'],['Speed now',v.toFixed(2)+' km/s'],['Year',a**1.5<2?(a**1.5*365.25).toFixed(1)+' days':(a**1.5).toFixed(2)+' years'],['Day',(Math.abs(b.rotH)<48?Math.abs(b.rotH).toFixed(2)+' h':(Math.abs(b.rotH)/24).toFixed(1)+' days')+(b.rotH<0?' (backwards)':'')]);
    if(sel!=='earth')F.push(['From Earth',fmtKm(dE*AU_KM)],['Light delay',(dE*499.005/60).toFixed(1)+' min']);else F.push(['Axial tilt','23.44°'],['Season',season(st)])}
  const box=$('#facts');box.innerHTML='';F.forEach(([k,v])=>{const d=document.createElement('div');d.innerHTML='<small></small><b></b>';d.firstChild.textContent=k;d.lastChild.textContent=v;box.appendChild(d)});
}
function season(st){const e=st.helio.earth,lon=(Math.atan2(-e[1],-e[0])/DEG+360)%360;const n=lon<90?'spring':lon<180?'summer':lon<270?'autumn':'winter';return n.charAt(0).toUpperCase()+n.slice(1)+' (north)'}

/* ---------- main update ---------- */
const state={helio:{},moonKm:384400};let orbitDirty=true,orbitT=0;
function update(){
  const T=(jd-2451545)/36525,days=jd-2451545;
  ORB.forEach(k=>{const p=helio(k,T);p.r=Math.hypot(p[0],p[1],p[2]);state.helio[k]=p});
  const m=MODES[mode];
  // every body is a unit sphere inside its tilt group; scaling the tilt group also scales rings, clouds and atmosphere
  BODIES.forEach(b=>objs[b.key].tilt.scale.setScalar(bodyRadius(b.key)));
  objs.sun.holder.position.set(0,0,0);objs.sun.b.glow.scale.setScalar(bodyRadius('sun')*(mode==='true'?6:3.2));
  ORB.forEach(k=>objs[k].holder.position.copy(toScene(state.helio[k],mode)));
  const mg=moonGeo(jd),mr=Math.hypot(...mg);state.moonKm=mr*6371;
  const earthPos=objs.earth.holder.position,mOff=new THREE.Vector3(mg[0],mg[2],-mg[1]).normalize();
  const md=m.moon?bodyRadius('earth')*m.moon*1.6:(mr*6371/AU_KM)*14;
  objs.moon.holder.position.copy(earthPos).addScaledVector(mOff,md);
  // spins: rotation angle from hours since J2000
  const hrs=days*24;BODIES.forEach(b=>{objs[b.key].spin.rotation.y=(hrs/b.rotH)%1*Math.PI*2});
  if(objs.earth.b.clouds)objs.earth.b.clouds.rotation.y=(hrs/30)%1*Math.PI*2*.05;
  // moon keeps one face to Earth
  objs.moon.spin.rotation.y=Math.atan2(-mOff.x,-mOff.z)+Math.PI/2;
  // asteroids
  for(let i=0;i<AST;i++){const a=astData[i],ang=a.M0+a.n*days,x=a.a*Math.cos(ang),y=a.a*Math.sin(ang),z=Math.sin(ang-a.node)*a.inc*a.a*.1;const v=toScene([x,y,z],mode);astPos[i*3]=v.x;astPos[i*3+1]=v.y;astPos[i*3+2]=v.z}
  astGeo.attributes.position.needsUpdate=true;astPts.visible=mode!=='true'||true;
  // orbit lines (recomputed every few frames: elements drift slowly over centuries)
  if(orbitDirty||++orbitT%20===0){orbitDirty=false;ORB.forEach(k=>{const el=elements(k,T),arr=orbitLines[k].geometry.attributes.position.array;for(let i=0;i<=360;i++){const p=orbitPoint(el,i/360*Math.PI*2),v=toScene(p,mode);arr[i*3]=v.x;arr[i*3+1]=v.y;arr[i*3+2]=v.z}orbitLines[k].geometry.attributes.position.needsUpdate=true})}
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  if(!paused)jd+=dir*rateDays*dt;
  jd=Math.max(2378496.5,Math.min(2524593.5,jd));
  update();
  const tgt=sel==='sun'?new THREE.Vector3():objs[sel].holder.position;
  // glide to a newly selected body, then lock on so fast-moving planets never drift out of frame
  if(view.locked)view.target.copy(tgt);else{view.target.lerp(tgt,Math.min(1,dt*5));if(view.target.distanceTo(tgt)<Math.max(bodyRadius(sel)*.3,view.dist*.01))view.locked=true}
  view.dist*=Math.pow(view.want/view.dist,Math.min(1,dt*4));
  const cp=Math.cos(view.pitch);
  camera.position.set(view.target.x+Math.sin(view.yaw)*cp*view.dist,view.target.y+Math.sin(view.pitch)*view.dist,view.target.z+Math.cos(view.yaw)*cp*view.dist);
  camera.lookAt(view.target);
  renderer.render(scene,camera);
  const v=new THREE.Vector3();
  BODIES.forEach(b=>{const o=objs[b.key],el=o.label;v.copy(o.holder.position).project(camera);
    const hideMoon=b.key==='moon'&&view.dist>bodyRadius('earth')*60&&sel!=='moon';
    if(v.z>1||hideMoon){el.hidden=true;return}el.hidden=false;
    const off=Math.max(8,bodyRadius(b.key)/view.dist*innerHeight*1.1);el.style.transform=`translate(${(v.x+1)/2*innerWidth+6}px,${(1-v.y)/2*innerHeight-off-8}px)`});
  const d=new Date((jd-2440587.5)*86400000);
  $('#date').textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  $('#time').textContent=d.toISOString().slice(11,19)+' UTC · JD '+jd.toFixed(3);
  const rd=rateDays*dir;$('#rate').textContent=paused?'Paused':Math.abs(rd)<1/3600?'Real time':`${dir<0?'−':''}${Math.abs(rd)>=1?Math.abs(rd).toFixed(Math.abs(rd)<10?1:0)+' days':(Math.abs(rd)*24).toFixed(1)+' hours'} per second`;
  updCard();
  requestAnimationFrame(frame);
}
resize();update();
const h=location.hash.slice(1);select(byKey[h]?h:'sun',!byKey[h]);view.dist=view.want;
requestAnimationFrame(frame);
</script>
